name: Universal macOS build
on:
  workflow_call:
    inputs:
      version:
        type: string
        default: '0.1.0'
  workflow_dispatch:
    inputs:
      version:
        description: Bundle version (MAJOR.MINOR.PATCH)
        default: '0.1.0'
        required: true
permissions:
  contents: read
jobs:
  universal:
    runs-on: ${{ vars.MACOS_BUILD_RUNNER || 'macos-15-intel' }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version
          uname -m
      - name: Resolve pinned dependencies
        run: swift package resolve
      - name: Core tests
        run: swift test --parallel --filter ExplorerCoreTests
      - name: Durable journal and real subprocess crash recovery tests
        run: |
          swift build --product RecoveryCrashProbe
          swift test --filter ExplorerJournalTests
      - name: Build universal app, ZIP, and DMG
        env:
          VERSION: ${{ inputs.version }}
          SPARKLE_PUBLIC_KEY: ${{ vars.SPARKLE_PUBLIC_KEY }}
        run: bash scripts/package.sh
      - name: Check bundle structure, architectures, and signatures
        run: bash scripts/verify-package.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: MacExplorer-universal
          path: |
            dist/*.zip
            dist/*.dmg
            dist/SHA256SUMS
            dist/INSTALL.md
          if-no-files-found: error
          retention-days: 30
