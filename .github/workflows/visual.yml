name: Native visual validation
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  swiftui:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15-intel, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      TZ: UTC
      LANG: en_US.UTF-8
      SWIFT_BACKTRACE: enable=yes,interactive=no,threads=all
      MACEXPLORER_SNAPSHOT_DIR: ${{ github.workspace }}/artifacts/native-views
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Capture production SwiftUI views and validate native layout and state
        run: |
          set -o pipefail
          mkdir -p artifacts/native-views
          xcodebuild -version > artifacts/native-views/toolchain.txt
          swift --version >> artifacts/native-views/toolchain.txt
          uname -m >> artifacts/native-views/toolchain.txt
          git rev-parse HEAD > artifacts/native-views/COMMIT.txt
          swift test --filter MacExplorerUITests 2>&1 | tee artifacts/native-views/test.log
      - name: Validate coverage, dimensions, and render content
        run: python3 scripts/validate-snapshots.py artifacts/native-views
      - name: Test optimized native input and scrolling
        id: optimized
        if: matrix.os == 'macos-26'
        env:
          MACEXPLORER_SNAPSHOT_DIR: ${{ github.workspace }}/artifacts/native-views/optimized-performance
        run: python3 scripts/measure-native-performance.py
      - name: Validate optimized performance provenance and budgets
        if: matrix.os == 'macos-26' && steps.optimized.outcome == 'success'
        env:
          PERFORMANCE_DIR: ${{ github.workspace }}/artifacts/native-views/optimized-performance
        run: |
          set -o pipefail
          python3 -m unittest discover -s scripts -p 'test_performance_validation.py' -v
          python3 scripts/validate-performance.py "$PERFORMANCE_DIR" --commit "$GITHUB_SHA" 2>&1 | tee "$PERFORMANCE_DIR/validation.log"
      - name: Retain native crash reports and toolchain diagnostics
        if: failure()
        run: |
          mkdir -p "$MACEXPLORER_SNAPSHOT_DIR/diagnostics"
          swift --version > "$MACEXPLORER_SNAPSHOT_DIR/diagnostics/toolchain.txt" 2>&1
          sw_vers >> "$MACEXPLORER_SNAPSHOT_DIR/diagnostics/toolchain.txt"
          python3 - <<'PYDIAG'
          import os, pathlib, shutil, time
          destination = pathlib.Path(os.environ['MACEXPLORER_SNAPSHOT_DIR']) / 'diagnostics'
          source = pathlib.Path.home() / 'Library/Logs/DiagnosticReports'
          reports = []
          if source.is_dir():
              for path in source.iterdir():
                  if path.is_symlink() or not path.is_file() or path.suffix not in ('.ips', '.crash'):
                      continue
                  if not path.name.lower().startswith(('xctest', 'macexplorer')):
                      continue
                  info = path.stat()
                  if info.st_size <= 5_000_000 and time.time() - info.st_mtime < 7200:
                      reports.append((info.st_mtime, path))
          for _, path in sorted(reports, reverse=True)[:8]:
              shutil.copy2(path, destination / path.name)
          print(f'Retained {min(len(reports), 8)} recent XCTest/application crash reports.')
          PYDIAG
      - name: Upload native PNGs, timing evidence, test log, and offline review gallery
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: MacExplorer-native-views-${{ matrix.os }}
          path: artifacts/native-views
          if-no-files-found: error
          retention-days: 30
